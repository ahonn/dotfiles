# Herdr config aligned to this machine's tmux muscle memory
# (modules/home-manager/programs/tmux.nix: prefix Ctrl-a).
#
# Semantic map:
#   tmux window  ≈ herdr tab
#   tmux session ≈ herdr workspace
#   tmux pane    ≈ herdr pane
#
# Edit freely; symlink is out-of-store so no rebuild needed.
# Reload a running server: herdr server reload-config  (or prefix+r)

onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "catppuccin"
# theme.custom.sidebar_bg needs post-0.8.0 (unreleased). Stay on stable for CJK IME;
# re-add when a release includes sidebar_bg without the HEAD IME regression.
#
# Border + active row (catppuccin mocha blue family):
#   sidebar │ / ─ + active space/agent row bg → surface_dim (shared token)
#   unfocused pane border + agent index/"grok" → overlay0 (agent label always +DIM)
#   focused pane / tab bg                      → accent
# overlay0 must stay high-luminance: agent_style is fg=overlay0+DIM on surface_dim.
[theme.custom]
panel_bg = "#1e1e2e"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#2a4060"  # deeper blue active bg so light labels pop
overlay0 = "#e0e7ff"     # near-white: index "1" + agent "grok" (+DIM still readable)
overlay1 = "#ffffff"
accent = "#89b4fa"        # tab / focused border (bright blue)
text = "#ffffff"         # active workspace name (bold)
subtext0 = "#a6adc8"     # inactive names
mauve = "#cba6f7"        # active branch label

[ui]
mouse_capture = true
copy_on_select = true
tab_bar_position = "top"
accent = "#89b4fa"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
confirm_close = true
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
resume_agents_on_restore = true

# CJK IME (stable 0.8.0 — worked before HEAD upgrade)
[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "grok", "opencode", "cursor"]
switch_ascii_input_source_in_prefix = true

[keys]
# --- prefix (matches programs.tmux.shortcut = "a") ---
prefix = "ctrl+a"

# --- tabs (tmux windows) ---
new_tab = "prefix+c"
previous_tab = "prefix+ctrl+j"
next_tab = "prefix+ctrl+k"
switch_tab = "prefix+1..9"
close_tab = "prefix+ctrl+q"
rename_tab = "prefix+shift+t"

# --- workspaces (tmux sessions) ---
# prefix+n was next_tab in herdr defaults; here it matches tmux new-session
new_workspace = "prefix+n"
close_workspace = "prefix+shift+q"
rename_workspace = "prefix+shift+w"
# tmux: bind s choose-tree -Zs is a session picker, so prefix+s belongs on
# workspace_picker (spaces only). goto opens the navigator, which also walks
# tabs and panes; it keeps herdr's own default key.
workspace_picker = ["prefix+w", "prefix+space", "prefix+s"]
goto = "prefix+g"
settings = "prefix+comma"

# --- panes ---
# herdr names splits after the resulting stack, tmux after the split axis:
# split_horizontal opens below (tmux -v), split_vertical opens right (tmux -h).
# Inverse names, same layout.
split_horizontal = "prefix+minus"
split_vertical = ["prefix+backslash", "prefix+v"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# tmux binds swap-pane to C-u/C-d and has no left/right swap; shift+hjkl is
# resize there, so it stays free for the resize binds at the end of this file.
swap_pane_up = "prefix+ctrl+u"
swap_pane_down = "prefix+ctrl+d"
swap_pane_left = ""
swap_pane_right = ""
# tmux: q kill-pane; herdr default was detach on q — swapped to tmux semantics
close_pane = "prefix+q"
detach = "prefix+d"
# tmux default is prefix+; for last-pane. prefix+ctrl+a would be tmux's
# last-window, but herdr has no last-tab action and rejects a doubled prefix
# (it sends a literal prefix key instead).
last_pane = "prefix+semicolon"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
copy_mode = "prefix+["
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# --- session / config ---
reload_config = "prefix+r"
toggle_sidebar = "prefix+b"
help = "prefix+?"

# --- pane resize (tmux: bind -r H/J/K/L resizep -L/-D/-U/-R 5) ---
# herdr exposes no directional resize action, only resize_mode (prefix+shift+r)
# for continuous adjustment. These shell binds call the socket API to keep
# tmux's one-shot feel; --amount defaults to a 0.05 split-ratio step.
# Keep at the end of the file: TOML assigns any bare key written after an
# [[keys.command]] table to that table instead of [keys].
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr pane resize --direction left --current"
description = "resize pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane resize --direction down --current"
description = "resize pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane resize --direction up --current"
description = "resize pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane resize --direction right --current"
description = "resize pane right"
